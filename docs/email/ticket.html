<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ticketId}} {{title}}</title>
</head>
<body style="margin:0;padding:0;background:#F4F7FB;">
  <div style="display:none;max-height:0;overflow:hidden;mso-hide:all;">
    {{eventLabel}} · {{ticketId}}
  </div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F4F7FB;margin:0;padding:0;">
    <tr>
      <td align="center" style="padding:32px 16px;">
        <table role="presentation" width="560" cellpadding="0" cellspacing="0" style="width:560px;max-width:560px;background:#FFFFFF;border:1px solid #E5E7EB;border-radius:12px;">
          <tr>
            <td style="padding:28px 28px 0 28px;font-family:'Plus Jakarta Sans',Arial,sans-serif;">
              <p style="margin:0;font-size:16px;line-height:24px;font-weight:600;color:#081634;">Desk</p>
              <p style="margin:4px 0 0 0;font-size:13px;line-height:18px;color:#667085;">VethanCon</p>
            </td>
          </tr>
          <tr>
            <td style="padding:24px 28px 0 28px;font-family:'Plus Jakarta Sans',Arial,sans-serif;">
              <p style="margin:0;font-size:13px;line-height:18px;font-weight:550;color:#0557A0;">{{eventLabel}}</p>
              <h1 style="margin:8px 0 0 0;font-size:22px;line-height:28px;font-weight:600;letter-spacing:-0.015em;color:#081634;">{{title}}</h1>
              <p style="margin:8px 0 0 0;font-size:13px;line-height:18px;font-family:'Geist Mono',ui-monospace,Consolas,monospace;color:#111827;">{{ticketId}} · {{meta}}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:20px 28px 0 28px;font-family:'Plus Jakarta Sans',Arial,sans-serif;font-size:16px;line-height:24px;color:#081634;">
              <p style="margin:0 0 8px 0;font-size:13px;line-height:18px;color:#667085;">{{actorName}} · {{actorDepartment}}</p>
              {{note}}
            </td>
          </tr>
          <tr>
            <td style="padding:24px 28px 0 28px;">
              <table role="presentation" cellpadding="0" cellspacing="0">
                <tr>
                  <td style="border-radius:10px;background:#0557A0;">
                    <a href="{{ticketUrl}}" style="display:inline-block;padding:12px 18px;font-family:'Plus Jakarta Sans',Arial,sans-serif;font-size:14px;line-height:20px;font-weight:600;color:#FFFFFF;text-decoration:none;">Open in Desk</a>
                  </td>
                </tr>
              </table>
            </td>
          </tr>
          <tr>
            <td style="padding:28px;font-family:'Plus Jakarta Sans',Arial,sans-serif;">
              <p style="margin:0 0 8px 0;font-size:13px;line-height:18px;font-weight:600;color:#081634;">Copied</p>
              <p style="margin:0;font-size:13px;line-height:20px;font-family:'Geist Mono',ui-monospace,Consolas,monospace;color:#111827;">{{copied}}</p>
            </td>
          </tr>
          <tr>
            <td style="padding:0 28px 28px 28px;border-top:1px solid #E5E7EB;font-family:'Plus Jakarta Sans',Arial,sans-serif;">
              <p style="margin:16px 0 0 0;font-size:13px;line-height:18px;color:#667085;">Reply in Desk. A reply to this email is not added to the ticket.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
