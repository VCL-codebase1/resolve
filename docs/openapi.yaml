openapi: 3.1.0
info:
  title: VethanCon Desk API
  version: "1.0.0"
  summary: Internal ticket desk for VethanCon staff.
  description: |
    Session-cookie API for Desk. Paths are relative to `/api/v1`.

    The human ticket id (`VC-1042`) and human task id (`TSK-1042`) are the
    identifiers in their paths. User ids and step/resource ids are UUIDs.

    Tasks are assigned work with review, delegated steps, evidence, comments,
    activity, reports and reminders. Role mapping from vcglone is
    `EMPLOYEE=member`, `MANAGER=lead`, `HR_ADMIN`/`SUPER_ADMIN=admin`.

    `POST /inbound/email` is specified and disabled. It returns 501
    until reply-by-email is switched on. It must not create messages.
servers:
  - url: /api/v1
    description: Same origin as the Desk app
tags:
  - name: Auth
  - name: Departments
  - name: People
  - name: Tickets
  - name: Tasks
  - name: Task reports
  - name: Notifications
  - name: Badges
  - name: Admin
  - name: Receipts
  - name: Webhooks
security:
  - sessionCookie: []
paths:
  /auth/login:
    post:
      tags: [Auth]
      summary: Sign in
      description: |
        Sets the `desk_session` cookie. A wrong password and a disabled
        account return the same 401. Rate-limited per email and per IP.
      security: []
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in. The session cookie is set.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: '`desk_session=<token>; HttpOnly; Secure; SameSite=Lax; Path=/`'
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Validation"
        "429":
          $ref: "#/components/responses/RateLimited"

  /auth/logout:
    post:
      tags: [Auth]
      summary: Sign out
      description: Revokes the current session and clears the cookie.
      operationId: logout
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie:
              schema:
                type: string
              description: Cookie cleared.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /me:
    get:
      tags: [Auth]
      summary: Current person
      operationId: getMe
      responses:
        "200":
          description: The signed-in person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /departments:
    get:
      tags: [Departments]
      summary: List departments
      description: The nine fixed departments, in the order they are seeded.
      operationId: listDepartments
      responses:
        "200":
          description: Departments.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Department"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /departments/{slug}:
    get:
      tags: [Departments]
      summary: One department
      description: Includes the people who receive the queue copy of a receipt.
      operationId: getDepartment
      parameters:
        - $ref: "#/components/parameters/DepartmentSlug"
      responses:
        "200":
          description: Department.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Department"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"

  /people:
    get:
      tags: [People]
      summary: Directory
      description: |
        Active and inactive people, as name, role, and department.
        Email addresses are included only when the caller is an admin.
      operationId: listPeople
      parameters:
        - name: department
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/DepartmentSlug"
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 100
      responses:
        "200":
          description: People.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Person"
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      tags: [People]
      summary: Create a person
      description: Admin only. There is no public sign-up.
      operationId: createPerson
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonCreate"
      responses:
        "201":
          description: Created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: That email is already in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Validation"

  /people/{id}:
    patch:
      tags: [People]
      summary: Update a person
      description: |
        Admin only. Can change name, role, home department, active flag,
        password, queue-recipient membership, and watched departments.
        Omitted fields stay as they are.
      operationId: updatePerson
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonUpdate"
      responses:
        "200":
          description: Updated person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: That email is already in use.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Validation"

  /tickets:
    get:
      tags: [Tickets]
      summary: List tickets
      description: |
        `scope=mine` (default) is tickets you raised, are assigned, or watch.
        `scope=queue` is tickets aimed at your home department.
        `scope=watching` is tickets aimed at a department you watch,
        excluding tickets already in `mine`.
        `scope=all` is every ticket. Admins only. Other roles receive 403.
        `department`, when set, limits the list to that target department.
        Members may only filter to their home department or one they watch.
        Admins may filter to any department.
        Pending is two statuses. Admins load it from `GET /admin/tickets`.
      operationId: listTickets
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [mine, queue, watching, all]
            default: mine
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/Status"
        - name: department
          in: query
          schema:
            $ref: "#/components/schemas/DepartmentSlug"
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: A page of tickets, newest activity first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Tickets]
      summary: Raise a ticket
      description: |
        The requester is the signed-in person. The source department is
        their home department at this moment and is stored on the ticket.
        Creates the first message from `body`. Notifies the target
        department's queue recipients. Does not notify the requester.
      operationId: createTicket
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketCreate"
      responses:
        "201":
          description: Created ticket, including the first message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          $ref: "#/components/responses/Validation"

  /tickets/{id}:
    get:
      tags: [Tickets]
      summary: Get a ticket
      description: |
        Caller must be the requester, the assignee, a watcher, a member
        of the source or target department, or an admin.
      operationId: getTicket
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Ticket, messages, watchers, and stage events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Tickets]
      summary: Assign, set priority, or change status
      description: |
        Lead of the target department, or an admin.
        Assigning a person sets status from `open` to `in_progress`.
        `assigneeId: null` clears the assignee and does not change status.
        The assignee must belong to the target department.
        `closed` is allowed only from `resolved`.
        A reply on a resolved ticket is what returns it to `open`; this
        route does not do that.
      operationId: updateTicket
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TicketUpdate"
      responses:
        "200":
          description: Updated ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The status change is not allowed from the current status.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Validation"

  /tickets/{id}/begin:
    post:
      tags: [Tickets]
      summary: Begin work on a ticket
      description: |
        Any member of the target department, or an admin. Claims an
        unassigned ticket for the caller and sets status to `in_progress`.
        An assigned ticket may only be started by its assignee or a
        lead/admin. Allowed from `open` or `waiting`.
      operationId: beginTicket
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Updated ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The ticket is closed or work has already started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tickets/{id}/complete:
    post:
      tags: [Tickets]
      summary: Mark a ticket completed
      description: |
        Assignee, lead of the target department, or admin. Sets status to
        `resolved`. The requester can still reply to reopen it. Idempotent
        on an already resolved ticket.
      operationId: completeTicket
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Updated ticket.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The ticket is closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /tickets/{id}/messages:
    post:
      tags: [Tickets]
      summary: Reply
      description: |
        Adds a note. Allowed for the requester, assignee, watchers,
        members of the target department, and admins.
        Refused with 409 when the ticket is `closed`.
        A reply on a `resolved` ticket sets status back to `open`.
        Files are added with `POST /tickets/{id}/attachments`.
      operationId: createMessage
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageCreate"
      responses:
        "201":
          description: The new message.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The ticket is closed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Validation"

  /tickets/{id}/watchers:
    post:
      tags: [Tickets]
      summary: Add a watcher
      description: |
        Lead of the target department, an admin, or the requester adding
        themselves. The watcher must be an active person.
      operationId: addWatcher
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [userId]
              properties:
                userId:
                  $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: Updated watcher list.
          content:
            application/json:
              schema:
                type: object
                required: [watchers]
                properties:
                  watchers:
                    type: array
                    items:
                      $ref: "#/components/schemas/Person"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          $ref: "#/components/responses/Validation"

  /tickets/{id}/watchers/{userId}:
    delete:
      tags: [Tickets]
      summary: Remove a watcher
      description: |
        Lead of the target department, an admin, or the requester
        removing themselves.
      operationId: removeWatcher
      parameters:
        - $ref: "#/components/parameters/TicketId"
        - $ref: "#/components/parameters/UserId"
      responses:
        "204":
          description: Removed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /tickets/{id}/attachments:
    post:
      tags: [Tickets]
      summary: Attach a file to a message
      description: |
        Multipart upload. The caller must have authored `messageId`,
        and the ticket must not be closed.
        Allowed types: `image/png`, `image/jpeg`, `image/webp`, `application/pdf`.
        The type is sniffed from the bytes. Maximum 10 MB.
        Maximum 5 files on one message.
      operationId: createAttachment
      parameters:
        - $ref: "#/components/parameters/TicketId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, messageId]
              properties:
                file:
                  type: string
                  format: binary
                messageId:
                  $ref: "#/components/schemas/Uuid"
      responses:
        "201":
          description: Stored attachment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Attachment"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          description: The ticket is closed, or the message already has 5 files.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The file is over 10 MB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: The file type is not allowed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Validation"

  /attachments/{id}:
    get:
      tags: [Tickets]
      summary: Download an attachment
      description: |
        Same read rule as the ticket the file belongs to.
        `Content-Type` is the sniffed media type.
        `Content-Disposition` is `inline` for images and `attachment` for PDF.
      operationId: getAttachment
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: File bytes.
          headers:
            Content-Type:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
          content:
            application/pdf:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/jpeg:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /badges:
    get:
      tags: [Badges]
      summary: Section counts for the current person
      description: |
        Counts for Inbox, Queue, and Alerts. Admins also receive `monitor`.
        Unresolved means `open`, `in_progress`, or `waiting`.
        A zero is returned as 0. The client hides that badge.
      operationId: getBadges
      responses:
        "200":
          description: Current counts.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Badges"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /admin/summary:
    get:
      tags: [Admin]
      summary: Monitor counts
      description: Admin only. Company-wide buckets and one row per department.
      operationId: adminSummary
      responses:
        "200":
          description: Monitor home.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /admin/tickets:
    get:
      tags: [Admin]
      summary: Tickets in one monitor section
      description: Admin only. Newest activity first.
      operationId: adminTickets
      parameters:
        - name: bucket
          in: query
          required: true
          schema:
            $ref: "#/components/schemas/MonitorBucket"
        - name: department
          in: query
          schema:
            $ref: "#/components/schemas/DepartmentSlug"
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: A page of tickets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TicketPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"

  /admin/outreach:
    get:
      tags: [Admin]
      summary: Outreach history
      description: Admin only. Newest first.
      operationId: listOutreach
      parameters:
        - name: department
          in: query
          schema:
            $ref: "#/components/schemas/DepartmentSlug"
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: Outreach records.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Admin]
      summary: Reach out to a department
      description: |
        Admin only. Sends a note to the department's queue recipients
        as an alert and an email. Does not create a ticket and does not
        change status. Refuses with 409 when that department has no
        unresolved tickets. The stored ticket ids are the unresolved
        set at send time.
      operationId: createOutreach
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutreachCreate"
      responses:
        "201":
          description: Recorded outreach.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Outreach"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          description: That department has no unresolved tickets.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "422":
          $ref: "#/components/responses/Validation"

  /notifications:
    get:
      tags: [Notifications]
      summary: List notifications for the current person
      operationId: listNotifications
      parameters:
        - name: unread
          in: query
          schema:
            type: boolean
            default: false
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: Newest first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationPage"
        "401":
          $ref: "#/components/responses/Unauthorized"

  /notifications/read:
    post:
      tags: [Notifications]
      summary: Mark notifications read
      description: |
        With `ids`, marks those rows read. They must belong to the caller.
        With an empty body or an empty `ids` array, marks every unread
        notification for the caller as read.
      operationId: markNotificationsRead
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items:
                    $ref: "#/components/schemas/Uuid"
      responses:
        "204":
          description: Updated.
        "401":
          $ref: "#/components/responses/Unauthorized"

  /tickets/{id}/receipts:
    get:
      tags: [Receipts]
      summary: Email receipts for a ticket
      description: |
        One row per outbound email. States are `queued`, `sent`, and `failed`.
        `sent` means the provider accepted the message. It does not mean
        every mailbox has opened it.
        Same read rule as the ticket.
      operationId: listReceipts
      parameters:
        - $ref: "#/components/parameters/TicketId"
      responses:
        "200":
          description: Receipts, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: "#/components/schemas/Receipt"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /webhooks/email:
    post:
      tags: [Webhooks]
      summary: Delivery status for a receipt
      description: |
        Called by the mail adapter after it has verified the provider
        signature. This route checks `X-Desk-Signature`, an HMAC-SHA256
        hex digest of the raw body using the webhook secret.
        Matches `providerMessageId` to a receipt and sets `sent` or `failed`.
        Unknown ids return 204 so a retry does not loop.
        This route does not use the session cookie.
      security: []
      operationId: emailWebhook
      parameters:
        - name: X-Desk-Signature
          in: header
          required: true
          schema:
            type: string
            description: Hex HMAC-SHA256 of the raw request body.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailWebhook"
      responses:
        "204":
          description: Accepted. Unknown message ids are ignored.
        "401":
          description: Signature missing or wrong.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /inbound/email:
    post:
      tags: [Webhooks]
      summary: Inbound email reply
      description: |
        Disabled. Always returns 501. Does not read the body into a ticket.

        When reply-by-email is switched on, this route will accept the
        `InboundEmail` body, verify the provider signature the same way
        as `/webhooks/email`, find the ticket from `token`, and append a
        message only if the sender address belongs to a person who is
        allowed to reply. Until that switch, clients and mail providers
        must not rely on this route.
      security: []
      operationId: inboundEmail
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InboundEmail"
      responses:
        "501":
          description: Reply-by-email is off.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
              examples:
                disabled:
                  value:
                    error:
                      code: inbound_disabled
                      message: Reply by email is not switched on. Open the ticket in Desk.

  /tasks:
    get:
      tags: [Tasks]
      summary: List tasks
      operationId: listTasks
      parameters:
        - name: scope
          in: query
          schema:
            type: string
            enum: [mine, team, organization]
            default: mine
          description: "`team` needs lead or admin; `organization` needs admin."
        - name: status
          in: query
          schema:
            type: string
            enum: [assigned, in_progress, blocked, in_review, changes_requested, completed, cancelled, overdue]
        - name: priority
          in: query
          schema:
            $ref: "#/components/schemas/TaskPriority"
        - name: department
          in: query
          schema:
            $ref: "#/components/schemas/DepartmentSlug"
        - name: q
          in: query
          schema:
            type: string
        - name: cursor
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 30
      responses:
        "200":
          description: Page of tasks, newest activity first.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskPage"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"
    post:
      tags: [Tasks]
      summary: Create a task
      description: |
        Members may assign only themselves and cannot add delegated steps.
        Leads may assign inside their department. Admins may assign anyone who
        is not an admin. Due must be at least 15 minutes away.
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskCreateRequest"
      responses:
        "201":
          description: Created task detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "422":
          $ref: "#/components/responses/Validation"

  /tasks/{id}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [Tasks]
      summary: One task
      operationId: getTask
      responses:
        "200":
          description: Task detail with steps, evidence, comments and activity.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Tasks]
      summary: Change assignee, priority or due time
      description: Reviewer only. A reason is required when assignee or due time changes.
      operationId: updateTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TaskPatchRequest"
      responses:
        "200":
          description: Updated task detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Validation"

  /tasks/{id}/start:
    post:
      tags: [Tasks]
      summary: Start work
      description: Assignee only. Allowed from `assigned` or `changes_requested`; idempotent on `in_progress`. An existing `startedAt` is preserved when work restarts after changes are requested.
      operationId: startTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "409":
          $ref: "#/components/responses/Conflict"
  /tasks/{id}/block:
    post:
      tags: [Tasks]
      summary: Block work
      description: Assignee only. Allowed from `assigned`, `in_progress`, or `changes_requested`.
      operationId: blockTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: Task detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "422":
          $ref: "#/components/responses/Validation"
  /tasks/{id}/resume:
    post:
      tags: [Tasks]
      summary: Resume a blocked task
      operationId: resumeTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      responses:
        "200":
          description: Task detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
  /tasks/{id}/submit:
    post:
      tags: [Tasks]
      summary: Submit for review
      description: Assignee only. Every required step must be completed. A self-assigned task owned by a member completes directly; lead and admin self-assignments go to review.
      operationId: submitTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteRequest"
      responses:
        "200":
          description: Task detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
  /tasks/{id}/approve:
    post:
      tags: [Tasks]
      summary: Approve a task in review
      operationId: approveTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteRequest"
      responses:
        "200":
          description: Task detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
  /tasks/{id}/request-changes:
    post:
      tags: [Tasks]
      summary: Send a task back for changes
      operationId: requestTaskChanges
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewRequest"
      responses:
        "200":
          description: Task detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
  /tasks/{id}/cancel:
    post:
      tags: [Tasks]
      summary: Cancel a task
      description: Reviewer only. The reason is stored as the review comment and open steps are cancelled.
      operationId: cancelTask
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: Task detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
  /tasks/{id}/comments:
    post:
      tags: [Tasks]
      summary: Add a comment
      operationId: addTaskComment
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CommentRequest"
      responses:
        "201":
          description: Task detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
  /tasks/{id}/resources:
    post:
      tags: [Tasks]
      summary: Add evidence
      description: Multipart form with a JSON `links` array and up to 10 `files`. PNG, JPEG, WEBP, PDF; 5 MB each.
      operationId: addTaskResource
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                links:
                  type: string
                  description: JSON-encoded array of http/https URLs.
                files:
                  type: array
                  items:
                    type: string
                    format: binary
      responses:
        "200":
          description: Task detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
  /tasks/{taskId}/resources/{resourceId}:
    get:
      tags: [Tasks]
      summary: Download a task file
      operationId: getTaskResource
      parameters:
        - name: taskId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/TaskId"
        - name: resourceId
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Uuid"
      responses:
        "200":
          description: File bytes with a private attachment disposition.
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"
  /tasks/{id}/steps:
    post:
      tags: [Tasks]
      summary: Add delegated steps
      description: Lead or admin only. Each step may name a receiving department and its head; the assignee must belong to that department.
      operationId: addTaskSteps
      parameters:
        - $ref: "#/components/parameters/TaskId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [steps]
              properties:
                steps:
                  type: array
                  minItems: 1
                  maxItems: 30
                  items:
                    $ref: "#/components/schemas/TaskStepRequest"
                step:
                  $ref: "#/components/schemas/TaskStepRequest"
      responses:
        "200":
          description: Task detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"

  /task-steps/{id}/start:
    post:
      tags: [Tasks]
      summary: Start a step
      operationId: startTaskStep
      parameters:
        - $ref: "#/components/parameters/TaskStepId"
      responses:
        "200":
          description: Parent task detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
  /task-steps/{id}/block:
    post:
      tags: [Tasks]
      summary: Block a step
      operationId: blockTaskStep
      parameters:
        - $ref: "#/components/parameters/TaskStepId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReasonRequest"
      responses:
        "200":
          description: Parent task detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
  /task-steps/{id}/resume:
    post:
      tags: [Tasks]
      summary: Resume a blocked step
      operationId: resumeTaskStep
      parameters:
        - $ref: "#/components/parameters/TaskStepId"
      responses:
        "200":
          description: Parent task detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
  /task-steps/{id}/complete:
    post:
      tags: [Tasks]
      summary: Complete a step
      operationId: completeTaskStep
      parameters:
        - $ref: "#/components/parameters/TaskStepId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NoteRequest"
      responses:
        "200":
          description: Parent task detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
  /task-steps/{id}/reassign:
    post:
      tags: [Tasks]
      summary: Reassign a step
      description: The assigning head, the receiving head, or an admin. The replacement must belong to the step’s receiving department.
      operationId: reassignTaskStep
      parameters:
        - $ref: "#/components/parameters/TaskStepId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReassignRequest"
      responses:
        "200":
          description: Parent task detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"

  /notifications/status:
    get:
      tags: [Notifications]
      summary: Task reminder status
      description: Delivers any reminders already due for the signed-in person and reports their state.
      operationId: taskReminderStatus
      responses:
        "200":
          description: Reminder state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskReminderStatus"
  /tasks/reminders/run:
    post:
      tags: [Tasks]
      summary: Deliver all due task reminders
      description: Admin only. Intended for a cron or manual trigger on serverless deployments.
      operationId: runTaskReminders
      responses:
        "200":
          description: Delivery result.
          content:
            application/json:
              schema:
                type: object
                required: [ok, delivered, at]
                properties:
                  ok:
                    type: boolean
                    enum: [true]
                  delivered:
                    type: integer
                  at:
                    type: string
                    format: date-time
        "403":
          $ref: "#/components/responses/Forbidden"

  /reports/tasks/data:
    get:
      tags: [Task reports]
      summary: Task report JSON
      operationId: taskReportData
      parameters:
        - $ref: "#/components/parameters/TaskReportScope"
        - $ref: "#/components/parameters/TaskReportPeriod"
        - $ref: "#/components/parameters/TaskReportDate"
        - $ref: "#/components/parameters/TaskReportEmployeeId"
        - $ref: "#/components/parameters/TaskReportDepartmentId"
      responses:
        "200":
          description: Report data.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskReport"
  /reports/tasks:
    get:
      tags: [Task reports]
      summary: Task report CSV
      operationId: taskReportCsv
      parameters:
        - $ref: "#/components/parameters/TaskReportScope"
        - $ref: "#/components/parameters/TaskReportPeriod"
        - $ref: "#/components/parameters/TaskReportDate"
        - $ref: "#/components/parameters/TaskReportEmployeeId"
        - $ref: "#/components/parameters/TaskReportDepartmentId"
      responses:
        "200":
          description: CSV attachment.
          content:
            text/csv:
              schema:
                type: string
  /reports/tasks/pdf:
    get:
      tags: [Task reports]
      summary: Task report PDF
      operationId: taskReportPdf
      parameters:
        - $ref: "#/components/parameters/TaskReportScope"
        - $ref: "#/components/parameters/TaskReportPeriod"
        - $ref: "#/components/parameters/TaskReportDate"
        - $ref: "#/components/parameters/TaskReportEmployeeId"
        - $ref: "#/components/parameters/TaskReportDepartmentId"
      responses:
        "200":
          description: PDF attachment.
          content:
            application/pdf:
              schema:
                type: string
                format: binary
  /reports/task-steps:
    get:
      tags: [Task reports]
      summary: Interdepartmental step CSV
      operationId: taskStepReportCsv
      parameters:
        - $ref: "#/components/parameters/TaskReportScope"
        - $ref: "#/components/parameters/TaskReportPeriod"
        - $ref: "#/components/parameters/TaskReportDate"
        - $ref: "#/components/parameters/TaskReportEmployeeId"
        - $ref: "#/components/parameters/TaskReportDepartmentId"
      responses:
        "200":
          description: CSV attachment.
          content:
            text/csv:
              schema:
                type: string

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: desk_session
      description: Server session. The cookie value is opaque. The server stores a hash.

  parameters:
    TicketId:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/TicketId"
    TaskId:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/TaskId"
    TaskStepId:
      name: id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    TaskReportScope:
      name: scope
      in: query
      schema:
        type: string
        enum: [mine, team, organization]
        default: mine
    TaskReportPeriod:
      name: period
      in: query
      schema:
        type: string
        enum: [daily, weekly, monthly]
        default: daily
    TaskReportDate:
      name: date
      in: query
      schema:
        type: string
        format: date
    TaskReportEmployeeId:
      name: employeeId
      in: query
      schema:
        $ref: "#/components/schemas/Uuid"
    TaskReportDepartmentId:
      name: departmentId
      in: query
      schema:
        $ref: "#/components/schemas/DepartmentSlug"
    UserId:
      name: userId
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/Uuid"
    DepartmentSlug:
      name: slug
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/DepartmentSlug"

  responses:
    Unauthorized:
      description: Not signed in, or the email and password do not match.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            login:
              value:
                error:
                  code: unauthorized
                  message: Email or password is wrong.
    Forbidden:
      description: Signed in, not allowed to do this.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: No such record, or it is hidden from this caller. The body does not say which.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Validation:
      description: A field is missing or out of range.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: The record is closed, already in that state, or the transition is not allowed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    RateLimited:
      description: Too many attempts. Retry after the header.
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              examples: [unauthorized, forbidden, not_found, validation, conflict, rate_limited, inbound_disabled]
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: string
              description: Present on validation errors. Keys are field names.

    Uuid:
      type: string
      format: uuid

    TicketId:
      type: string
      pattern: '^VC-[1-9][0-9]*$'
      examples: ["VC-1042"]

    DepartmentSlug:
      type: string
      enum:
        - it-software
        - business-operations
        - hr-admin
        - account-finance
        - sales
        - business-development
        - exhibition
        - creative-marketing
        - logistic-warehouse

    Role:
      type: string
      enum: [member, lead, admin]

    Status:
      type: string
      enum: [open, in_progress, waiting, resolved, closed]

    Priority:
      type: string
      enum: [low, normal, high, urgent]

    Sound:
      type: string
      enum: [raise, reply, status]

    MonitorBucket:
      type: string
      enum: [raised, pending, resolved, closed]

    Badges:
      type: object
      required: [inbox, queue, alerts]
      properties:
        inbox:
          type: integer
          minimum: 0
          description: Unresolved tickets in the caller's inbox.
        queue:
          type: integer
          minimum: 0
          description: Unresolved tickets aimed at the caller's home department.
        alerts:
          type: integer
          minimum: 0
          description: Unread notifications.
        monitor:
          $ref: "#/components/schemas/MonitorCounts"
          description: Present only when the caller is an admin.

    MonitorCounts:
      type: object
      required: [raised, pending, resolved, closed]
      properties:
        raised:
          type: integer
          minimum: 0
        pending:
          type: integer
          minimum: 0
        resolved:
          type: integer
          minimum: 0
        closed:
          type: integer
          minimum: 0

    DepartmentCounts:
      allOf:
        - $ref: "#/components/schemas/MonitorCounts"
        - type: object
          required: [slug, name, unresolved]
          properties:
            slug:
              $ref: "#/components/schemas/DepartmentSlug"
            name:
              type: string
            unresolved:
              type: integer
              minimum: 0
              description: raised + pending for this target department.

    AdminSummary:
      allOf:
        - $ref: "#/components/schemas/MonitorCounts"
        - type: object
          required: [departments]
          properties:
            departments:
              type: array
              minItems: 9
              maxItems: 9
              items:
                $ref: "#/components/schemas/DepartmentCounts"

    OutreachCreate:
      type: object
      required: [departmentSlug, note]
      properties:
        departmentSlug:
          $ref: "#/components/schemas/DepartmentSlug"
        note:
          type: string
          minLength: 1
          maxLength: 2000

    Outreach:
      type: object
      required: [id, departmentSlug, note, unresolvedCount, ticketIds, createdAt, actor, receipt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        departmentSlug:
          $ref: "#/components/schemas/DepartmentSlug"
        note:
          type: string
        unresolvedCount:
          type: integer
          minimum: 1
        ticketIds:
          type: array
          items:
            $ref: "#/components/schemas/TicketId"
        createdAt:
          type: string
          format: date-time
        actor:
          $ref: "#/components/schemas/Person"
        receipt:
          $ref: "#/components/schemas/Receipt"

    OutreachPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Outreach"
        nextCursor:
          type: [string, "null"]

    ReceiptState:
      type: string
      enum: [queued, sent, failed]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1

    Me:
      type: object
      required: [id, email, name, role, departmentSlug, watches, active]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        email:
          type: string
          format: email
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        departmentSlug:
          $ref: "#/components/schemas/DepartmentSlug"
        watches:
          type: array
          items:
            $ref: "#/components/schemas/DepartmentSlug"
        active:
          type: boolean

    Person:
      type: object
      required: [id, name, role, departmentSlug, active]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        role:
          $ref: "#/components/schemas/Role"
        departmentSlug:
          $ref: "#/components/schemas/DepartmentSlug"
        active:
          type: boolean
        email:
          type: string
          format: email
          description: Present when the caller is an admin.

    PersonCreate:
      type: object
      required: [name, email, password, role, departmentSlug]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
          maxLength: 200
        role:
          $ref: "#/components/schemas/Role"
        departmentSlug:
          $ref: "#/components/schemas/DepartmentSlug"
        queueRecipient:
          type: boolean
          default: false
          description: When true, this person is copied on receipts for their home department.
        watches:
          type: array
          items:
            $ref: "#/components/schemas/DepartmentSlug"

    PersonUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 10
          maxLength: 200
        role:
          $ref: "#/components/schemas/Role"
        departmentSlug:
          $ref: "#/components/schemas/DepartmentSlug"
        active:
          type: boolean
        queueRecipient:
          type: boolean
        watches:
          type: array
          items:
            $ref: "#/components/schemas/DepartmentSlug"

    Department:
      type: object
      required: [slug, name, recipients]
      properties:
        slug:
          $ref: "#/components/schemas/DepartmentSlug"
        name:
          type: string
        recipients:
          type: array
          description: People copied on the department queue receipt.
          items:
            $ref: "#/components/schemas/Person"

    Ticket:
      type: object
      required:
        - id
        - title
        - status
        - priority
        - requester
        - sourceDepartment
        - targetDepartment
        - assignee
        - createdAt
        - updatedAt
      properties:
        id:
          $ref: "#/components/schemas/TicketId"
        title:
          type: string
        status:
          $ref: "#/components/schemas/Status"
        priority:
          $ref: "#/components/schemas/Priority"
        requester:
          $ref: "#/components/schemas/Person"
        sourceDepartment:
          $ref: "#/components/schemas/DepartmentSlug"
        targetDepartment:
          $ref: "#/components/schemas/DepartmentSlug"
        assignee:
          oneOf:
            - $ref: "#/components/schemas/Person"
            - type: "null"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TicketPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Ticket"
        nextCursor:
          type: [string, "null"]

    TicketCreate:
      type: object
      required: [title, body, targetDepartment]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        body:
          type: string
          minLength: 1
          maxLength: 8000
        targetDepartment:
          $ref: "#/components/schemas/DepartmentSlug"
        priority:
          $ref: "#/components/schemas/Priority"
          default: normal

    TicketUpdate:
      type: object
      description: At least one field is required.
      properties:
        status:
          $ref: "#/components/schemas/Status"
        priority:
          $ref: "#/components/schemas/Priority"
        assigneeId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"

    Message:
      type: object
      required: [id, ticketId, author, body, createdAt, attachments]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        ticketId:
          $ref: "#/components/schemas/TicketId"
        author:
          $ref: "#/components/schemas/Person"
        body:
          type: string
        createdAt:
          type: string
          format: date-time
        attachments:
          type: array
          items:
            $ref: "#/components/schemas/Attachment"

    MessageCreate:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 8000

    TicketDetail:
      allOf:
        - $ref: "#/components/schemas/Ticket"
        - type: object
          required: [messages, watchers, events]
          properties:
            messages:
              type: array
              items:
                $ref: "#/components/schemas/Message"
            watchers:
              type: array
              items:
                $ref: "#/components/schemas/Person"
            events:
              type: array
              items:
                $ref: "#/components/schemas/TicketEvent"

    TicketEvent:
      type: object
      required: [id, type, toStatus, actor, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        type:
          type: string
          enum: [created, assigned, unassigned, started, waiting, resolved, reopened, closed, opened]
        fromStatus:
          type: [string, "null"]
          enum: [open, in_progress, waiting, resolved, closed, null]
        toStatus:
          $ref: "#/components/schemas/Status"
        actor:
          oneOf:
            - $ref: "#/components/schemas/Person"
            - type: "null"
        createdAt:
          type: string
          format: date-time

    Attachment:
      type: object
      required: [id, messageId, name, mediaType, size]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        messageId:
          $ref: "#/components/schemas/Uuid"
        name:
          type: string
        mediaType:
          type: string
          enum: [image/png, image/jpeg, image/webp, application/pdf]
        size:
          type: integer
          minimum: 1

    Notification:
      type: object
      required: [id, type, sentence, sound, read, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        type:
          type: string
          enum: [ticket.raised, ticket.replied, ticket.assigned, ticket.status_changed, department.outreach, task.created, task.updated, task.started, task.blocked, task.resumed, task.submitted, task.approved, task.changes_requested, task.completed, task.cancelled, task.commented, task.resource_added, task.step_added, task.step_started, task.step_blocked, task.step_resumed, task.step_completed, task.step_reassigned, task.reminder]
        ticketId:
          oneOf:
            - $ref: "#/components/schemas/TicketId"
            - type: "null"
          description: Null for department.outreach and task.* notifications.
        taskId:
          oneOf:
            - $ref: "#/components/schemas/TaskId"
            - type: "null"
          description: Set for task.* notifications; use it to open the task detail.
        departmentSlug:
          $ref: "#/components/schemas/DepartmentSlug"
          description: Set when type is department.outreach.
        sentence:
          type: string
          description: The one-line alert from the product doc.
        sound:
          $ref: "#/components/schemas/Sound"
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time
        actor:
          $ref: "#/components/schemas/Person"

    NotificationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Notification"
        nextCursor:
          type: [string, "null"]

    Receipt:
      type: object
      required: [id, event, to, cc, state, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        ticketId:
          oneOf:
            - $ref: "#/components/schemas/TicketId"
            - type: "null"
          description: Set for ticket mail. Null for an outreach receipt.
        outreachId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"
          description: Set for an outreach receipt. Null for ticket mail.
        event:
          type: string
          enum: [ticket.raised, ticket.replied, ticket.assigned, ticket.status_changed, department.outreach]
        providerMessageId:
          type: [string, "null"]
          description: Set once the provider accepts the send. Also used as the email Message-ID.
        to:
          type: array
          items:
            type: string
            format: email
        cc:
          type: array
          items:
            type: string
            format: email
        state:
          $ref: "#/components/schemas/ReceiptState"
        createdAt:
          type: string
          format: date-time

    EmailWebhook:
      type: object
      required: [providerMessageId, state]
      properties:
        providerMessageId:
          type: string
        state:
          type: string
          enum: [sent, failed]
        reason:
          type: string
          description: Short provider reason when state is failed. Not shown raw in the product UI.

    InboundEmail:
      type: object
      description: |
        Future body for reply-by-email. Ignored while the route returns 501.
      required: [token, from, text, messageId]
      properties:
        token:
          type: string
          description: The token in `ticket+{token}@` from the Reply-To address.
        from:
          type: string
          format: email
        text:
          type: string
          description: Plain-text body, with the quoted receipt stripped by the parser.
        messageId:
          type: string
          description: The inbound Message-ID.
        inReplyTo:
          type: string
          description: The Message-ID this mail answers. Should match a receipt.
        subject:
          type: string

    TaskId:
      type: string
      pattern: "^TSK-[1-9][0-9]*$"
      description: Human task id allocated from an never-resetting sequence.
    TaskStatus:
      type: string
      enum: [assigned, in_progress, blocked, in_review, changes_requested, completed, cancelled]
    TaskStepStatus:
      type: string
      enum: [assigned, in_progress, blocked, completed, cancelled]
    TaskPriority:
      type: string
      enum: [low, medium, high, urgent]
    TaskResourceType:
      type: string
      enum: [link, file]

    Task:
      type: object
      required: [id, name, description, assignee, assignedBy, priority, status, dueAt, reminderOffsets, overdue, createdAt, updatedAt]
      properties:
        id:
          $ref: "#/components/schemas/TaskId"
        name:
          type: string
        description:
          type: string
        expectedOutcome:
          type: [string, "null"]
        assignee:
          $ref: "#/components/schemas/Person"
        assignedBy:
          $ref: "#/components/schemas/Person"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        status:
          $ref: "#/components/schemas/TaskStatus"
        startAt:
          type: [string, "null"]
          format: date-time
        dueAt:
          type: string
          format: date-time
        reminderOffsets:
          type: array
          description: Minutes before due at which reminders are sent. Zero means due time.
          items:
            type: integer
        blockedReason:
          type: [string, "null"]
        submissionNote:
          type: [string, "null"]
        reviewComment:
          type: [string, "null"]
        startedAt:
          type: [string, "null"]
          format: date-time
        blockedAt:
          type: [string, "null"]
          format: date-time
        submittedAt:
          type: [string, "null"]
          format: date-time
        approvedAt:
          type: [string, "null"]
          format: date-time
        completedAt:
          type: [string, "null"]
          format: date-time
        cancelledAt:
          type: [string, "null"]
          format: date-time
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        overdue:
          type: boolean
          description: True only while the task is active and its due time has passed.

    TaskStep:
      type: object
      required: [id, taskId, title, position, required, assignee, assignedBy, interdepartmental, status, dueAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        taskId:
          $ref: "#/components/schemas/TaskId"
        title:
          type: string
        description:
          type: [string, "null"]
        position:
          type: integer
        required:
          type: boolean
        assignee:
          $ref: "#/components/schemas/Person"
        assignedBy:
          $ref: "#/components/schemas/Person"
        sourceDepartment:
          type: [string, "null"]
        targetDepartment:
          type: [string, "null"]
        targetLead:
          oneOf:
            - $ref: "#/components/schemas/Person"
            - type: "null"
        interdepartmental:
          type: boolean
          description: True when the receiving department differs from the assigning department.
        status:
          $ref: "#/components/schemas/TaskStepStatus"
        dueAt:
          type: string
          format: date-time
        startedAt:
          type: [string, "null"]
          format: date-time
        blockedAt:
          type: [string, "null"]
          format: date-time
        blockedReason:
          type: [string, "null"]
        completedAt:
          type: [string, "null"]
          format: date-time
        completionNote:
          type: [string, "null"]
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    TaskResource:
      type: object
      required: [id, taskId, uploader, type, title, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        taskId:
          $ref: "#/components/schemas/TaskId"
        uploader:
          $ref: "#/components/schemas/Person"
        type:
          $ref: "#/components/schemas/TaskResourceType"
        title:
          type: string
        url:
          type: [string, "null"]
        fileName:
          type: [string, "null"]
        mediaType:
          type: [string, "null"]
        size:
          type: [integer, "null"]
        createdAt:
          type: string
          format: date-time

    TaskComment:
      type: object
      required: [id, taskId, author, body, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        taskId:
          $ref: "#/components/schemas/TaskId"
        author:
          $ref: "#/components/schemas/Person"
        body:
          type: string
        createdAt:
          type: string
          format: date-time

    TaskActivity:
      type: object
      required: [id, taskId, action, message, createdAt]
      properties:
        id:
          $ref: "#/components/schemas/Uuid"
        taskId:
          $ref: "#/components/schemas/TaskId"
        actor:
          oneOf:
            - $ref: "#/components/schemas/Person"
            - type: "null"
        action:
          type: string
          description: Uppercase stage key such as CREATED, STARTED, BLOCKED or APPROVED.
        message:
          type: string
        metadata:
          type: [object, "null"]
        createdAt:
          type: string
          format: date-time

    TaskDetail:
      allOf:
        - $ref: "#/components/schemas/Task"
        - type: object
          required: [steps, resources, comments, activities]
          properties:
            steps:
              type: array
              items:
                $ref: "#/components/schemas/TaskStep"
            resources:
              type: array
              items:
                $ref: "#/components/schemas/TaskResource"
            comments:
              type: array
              items:
                $ref: "#/components/schemas/TaskComment"
            activities:
              type: array
              items:
                $ref: "#/components/schemas/TaskActivity"

    TaskPage:
      type: object
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        nextCursor:
          type: [string, "null"]

    TaskStepRequest:
      type: object
      description: When targetDepartment is set, the assignee must belong to that department and targetLeadId must be an active lead there.
      required: [title, assigneeId, dueAt]
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 160
        description:
          type: string
        position:
          type: integer
        required:
          type: boolean
          default: true
        assigneeId:
          $ref: "#/components/schemas/Uuid"
        dueAt:
          type: string
          format: date-time
        targetDepartment:
          oneOf:
            - $ref: "#/components/schemas/DepartmentSlug"
            - type: "null"
        targetLeadId:
          oneOf:
            - $ref: "#/components/schemas/Uuid"
            - type: "null"

    TaskCreateRequest:
      type: object
      required: [name, description, assigneeId, dueAt]
      properties:
        name:
          type: string
          minLength: 3
          maxLength: 160
        description:
          type: string
          minLength: 5
          maxLength: 10000
        expectedOutcome:
          type: string
          minLength: 1
          maxLength: 5000
        assigneeId:
          $ref: "#/components/schemas/Uuid"
        priority:
          $ref: "#/components/schemas/TaskPriority"
          default: medium
        startAt:
          type: string
          format: date-time
        dueAt:
          type: string
          format: date-time
        reminderOffsets:
          type: array
          maxItems: 6
          items:
            type: integer
            minimum: 0
            maximum: 43200
          default: [1440, 120, 0]
        resourceLinks:
          type: array
          items:
            type: string
            format: uri
        steps:
          type: array
          maxItems: 30
          items:
            $ref: "#/components/schemas/TaskStepRequest"

    TaskPatchRequest:
      type: object
      description: At least one field is required. A reason is required when assigneeId or dueAt changes.
      properties:
        assigneeId:
          $ref: "#/components/schemas/Uuid"
        priority:
          $ref: "#/components/schemas/TaskPriority"
        dueAt:
          type: string
          format: date-time
        reason:
          type: string

    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 1000
    NoteRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 5000
    ReviewRequest:
      type: object
      required: [comment]
      properties:
        comment:
          type: string
          minLength: 1
          maxLength: 5000
    CommentRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 5000
    ReassignRequest:
      type: object
      required: [assigneeId]
      properties:
        assigneeId:
          $ref: "#/components/schemas/Uuid"

    TaskReminderStatus:
      type: object
      required: [ok, due, delivered, at]
      properties:
        ok:
          type: boolean
          enum: [true]
        due:
          type: integer
        delivered:
          type: integer
          description: Reminders delivered by this request.
        at:
          type: string
          format: date-time

    TaskReport:
      type: object
      required: [range, scope, metrics, trend, statusData, people, departments, tasks, delegatedSteps, delegationMetrics]
      properties:
        range:
          type: object
          required: [from, to, period, date]
          properties:
            from:
              type: string
              format: date-time
            to:
              type: string
              format: date-time
            period:
              type: string
              enum: [daily, weekly, monthly]
            date:
              type: string
              format: date
        scope:
          type: string
          enum: [mine, team, organization]
        metrics:
          type: object
          required: [total, assigned, due, completed, completedOnTime, overdue, active, blocked, completionRate, onTimeRate, averageCompletionHours]
          properties:
            total:
              type: integer
              description: Tasks included in the report view.
            assigned:
              type: integer
              description: Tasks created in the selected range.
            due:
              type: integer
              description: Active or completed tasks due in the selected range.
            completed:
              type: integer
              description: Tasks completed in the selected range.
            completedOnTime:
              type: integer
            overdue:
              type: integer
            active:
              type: integer
            blocked:
              type: integer
            completionRate:
              type: integer
              description: Due tasks completed before the range ended, as a percentage.
            onTimeRate:
              type: integer
            averageCompletionHours:
              type: number
        trend:
          type: array
          items:
            type: object
            required: [label, created, completed]
            properties:
              label:
                type: string
                description: Africa/Lagos date for the bucket.
              created:
                type: integer
              completed:
                type: integer
        statusData:
          type: array
          items:
            type: object
            required: [status, count]
            properties:
              status:
                $ref: "#/components/schemas/TaskStatus"
              count:
                type: integer
        people:
          type: array
          items:
            type: object
            required: [id, name, department, total, assigned, completed, onTime, overdue, hours, onTimeRate, averageCompletionHours]
            properties:
              id:
                $ref: "#/components/schemas/Uuid"
              name:
                type: string
              department:
                type: string
              total:
                type: integer
              assigned:
                type: integer
              completed:
                type: integer
              onTime:
                type: integer
              overdue:
                type: integer
              hours:
                type: number
                description: Total completion hours for work completed in the range.
              onTimeRate:
                type: integer
              averageCompletionHours:
                type: number
        departments:
          type: array
          items:
            type: object
            required: [slug, name, members, total, assigned, completed, onTime, overdue, onTimeRate]
            properties:
              slug:
                $ref: "#/components/schemas/DepartmentSlug"
              name:
                type: string
              members:
                type: integer
              total:
                type: integer
              assigned:
                type: integer
              completed:
                type: integer
              onTime:
                type: integer
              overdue:
                type: integer
              onTimeRate:
                type: integer
        tasks:
          type: array
          items:
            $ref: "#/components/schemas/Task"
        delegatedSteps:
          type: array
          items:
            $ref: "#/components/schemas/TaskStep"
        delegationMetrics:
          type: object
          required: [total, interdepartmental, active, blocked, overdue, completed, completionRate, onTimeRate, averageResponseHours, averageCompletionHours, averageHours]
          properties:
            total:
              type: integer
            interdepartmental:
              type: integer
            active:
              type: integer
            blocked:
              type: integer
            overdue:
              type: integer
            completed:
              type: integer
            completionRate:
              type: integer
            onTimeRate:
              type: integer
            averageResponseHours:
              type: number
            averageCompletionHours:
              type: number
            averageHours:
              type: number
              description: Backwards-compatible alias for averageCompletionHours.
